[project]
name = "llm-gateway"
version = "0.1.0"
description = "Gateway API with rotating pool of multi-provider (Gemini/Groq/OpenRouter) API keys and automatic failover"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30.0",
    "alembic>=1.18.5",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "PyJWT>=2.9.0",
    "Authlib>=1.3.2",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/alembic/versions"]

[tool.ruff.lint]
ignore = [
    # FastAPI's dependency-injection pattern is `param: X = Depends(get_x)`.
    # That's idiomatic FastAPI, not the "mutable default argument" bug B008
    # is meant to catch — safe to ignore project-wide.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use asserts, and swallow-and-continue is a deliberate
# pattern in a few fake/fixture helpers, not a security concern.
"app/tests/**" = ["S101"]