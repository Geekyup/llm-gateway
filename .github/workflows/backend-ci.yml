name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same dummies conftest.py sets — provided here too so anything that
      # imports settings at collection time (before conftest runs) is safe.
      ENCRYPTION_KEY: "kQ80G5wq1v3o2r7m6b8p3s5t9u1w4y6a8c0e2g4i6k8="
      ADMIN_API_KEY: "test-admin-key"
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
      JWT_SECRET_KEY: "test-jwt-secret-key"
      SESSION_SECRET_KEY: "test-session-secret-key"
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -e ".[dev]"

      - name: Lint with ruff
        run: ruff check app tests

      - name: Run tests
        run: pytest -v
